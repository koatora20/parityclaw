[package]
name = "guava-bridge"
version = "0.1.0"
edition = "2021"
description = "GPI bridge: guava-anti MCP → OpenCrabs Tool System"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
